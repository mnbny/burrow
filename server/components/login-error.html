<div
  id="sign-in-error"
  role="alert"
  aria-atomic="true"
  class="fixed right-5 bottom-5 left-5 z-50 overflow-hidden border-2 border-error bg-base-100/95 text-base-content shadow-[4px_4px_0_var(--color-error)] sm:right-8 sm:bottom-8 sm:left-auto sm:w-96">
  <div
    class="flex items-center gap-2 bg-error px-3 py-2 font-mono text-xs font-bold tracking-[0.1em] text-error-content uppercase">
    <svg
      aria-hidden="true"
      class="size-4 shrink-0"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round">
      <path d="m6 6 12 12M6 18 18 6" />
    </svg>
    <span>Error</span>
    <button
      type="button"
      aria-label="Dismiss notification"
      hidden
      class="-my-1 -mr-1 ml-auto inline-flex size-7 shrink-0 cursor-pointer items-center justify-center text-current outline-none hover:bg-current/10 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-current">
      <svg
        aria-hidden="true"
        class="size-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round">
        <path d="m6 6 12 12M6 18 18 6" />
      </svg>
    </button>
  </div>
  <p class="p-4 text-base leading-6 font-medium wrap-anywhere">Wrong username or password.</p>
</div>
