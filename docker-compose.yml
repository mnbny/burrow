name: moonbunny
services:
  burrow:
    image: ${IMAGE_URL:-ghcr.io/mnbny/burrow}:${IMAGE_VERSION:-latest}
    ports:
      - '${PORT:-8080}:8080'
    environment:
      DEPLOY_TOKENS: ${DEPLOY_TOKENS:-changeme} # comma-separated
      MAX_BODY_MB: ${MAX_BODY_MB:-50}
      HIDE_FOOTER: ${HIDE_FOOTER:-0}
    volumes:
      - '${DATA_PATH:-./data}:/data'
    restart: unless-stopped
